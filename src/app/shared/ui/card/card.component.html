<mat-card [class.elevated-card]="elevated" class="app-custom-card">
  <mat-card-header *ngIf="title || subtitle">
    <mat-card-title *ngIf="title" class="title-lg">{{ title }}</mat-card-title>
    <mat-card-subtitle *ngIf="subtitle" class="body-md">{{ subtitle }}</mat-card-subtitle>
    <ng-content select="[card-header-action]"></ng-content>
  </mat-card-header>
  
  <mat-card-content class="app-card-content">
    <ng-content></ng-content>
  </mat-card-content>
  
  <mat-card-actions *ngIf="hasActions">
    <ng-content select="[card-actions]"></ng-content>
  </mat-card-actions>
</mat-card>
