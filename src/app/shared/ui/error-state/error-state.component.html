<div class="error-state-container">
  <div class="icon-container">
    <mat-icon class="error-icon">{{ icon }}</mat-icon>
  </div>
  <h3 class="title-lg">{{ title }}</h3>
  <p class="body-md message">{{ message }}</p>
  
  <div class="actions">
    <button mat-outlined-button color="primary" (click)="retry.emit()">
      <mat-icon>refresh</mat-icon>
      
      {{ retryLabel }}
    </button>
  </div>
</div>
