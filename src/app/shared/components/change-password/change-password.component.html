<div class="change-password-container">
  <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="change-password-form">
    
    <!-- Current Password -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Current Password</mat-label>
      <input matInput 
             [type]="hideCurrent ? 'password' : 'text'" 
             formControlName="currentPassword" 
             placeholder="Enter your current password">
      <button mat-icon-button matSuffix (click)="hideCurrent = !hideCurrent" type="button" 
              [attr.aria-label]="'Hide current password'" [attr.aria-pressed]="hideCurrent">
        <mat-icon>{{hideCurrent ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('currentPassword')?.hasError('required')">
        Current password is required
      </mat-error>
    </mat-form-field>

    <!-- New Password -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>New Password</mat-label>
      <input matInput 
             [type]="hideNew ? 'password' : 'text'" 
             formControlName="newPassword" 
             placeholder="Enter new password">
      <button mat-icon-button matSuffix (click)="hideNew = !hideNew" type="button" 
              [attr.aria-label]="'Hide new password'" [attr.aria-pressed]="hideNew">
        <mat-icon>{{hideNew ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('required')">
        New password is required
      </mat-error>
      <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
        Password must be at least 8 characters long
      </mat-error>
    </mat-form-field>

    <!-- Confirm Password -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Confirm New Password</mat-label>
      <input matInput 
             [type]="hideConfirm ? 'password' : 'text'" 
             formControlName="confirmPassword" 
             placeholder="Confirm new password"
             [errorStateMatcher]="matcher">
      <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" type="button" 
              [attr.aria-label]="'Hide confirm password'" [attr.aria-pressed]="hideConfirm">
        <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('confirmPassword')?.hasError('required')">
        Please confirm your new password
      </mat-error>
      <mat-error *ngIf="!changePasswordForm.get('confirmPassword')?.hasError('required') && changePasswordForm.hasError('passwordMismatch')">
        Passwords do not match
      </mat-error>
    </mat-form-field>

    <div class="form-actions mt-4">
      <button mat-flat-button color="primary" 
              type="submit" 
              [disabled]="changePasswordForm.invalid || isSubmitting"
              class="submit-button h-12 w-full !rounded-lg text-base">
        <ng-container *ngIf="!isSubmitting">Change Password</ng-container>
        <ng-container *ngIf="isSubmitting">
          <mat-spinner diameter="24" class="spinner-white"></mat-spinner>
          <span class="ml-2">Updating...</span>
        </ng-container>
      </button>
    </div>
  </form>
</div>
