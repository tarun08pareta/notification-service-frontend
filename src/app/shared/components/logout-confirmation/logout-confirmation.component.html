<h2 mat-dialog-title class="m-0 text-xl font-medium border-b border-slate-100 dark:border-slate-800 pb-4">
  Logout
</h2>

<mat-dialog-content class="px-6 py-4 min-w-[300px]">
  <p class="text-slate-700 dark:text-slate-300">
    Are you sure you want to logout?
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="px-6 pb-6 border-t border-slate-100 dark:border-slate-800">
  <button mat-stroked-button mat-dialog-close>
    Cancel
  </button>
  <button mat-flat-button color="warn" [mat-dialog-close]="true">
    Logout
  </button>
</mat-dialog-actions>
