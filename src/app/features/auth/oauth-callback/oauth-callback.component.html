<div style="
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:#fff;
  font-family:system-ui,sans-serif;
  text-align:center;
  padding:2rem;
">
  @if (!hasError) {
    <div>
      <svg style="width:2.5rem;height:2.5rem;animation:spin 1s linear infinite;color:#3b82f6;margin:0 auto 1rem"
           xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path style="opacity:.75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      <p style="font-size:.95rem;font-weight:500;color:#374151">Completing sign-in…</p>
      <p style="font-size:.8rem;color:#9ca3af;margin-top:.25rem">This window will close automatically.</p>
    </div>
  }

  @if (hasError) {
    <div>
      <div style="width:3rem;height:3rem;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
        <svg style="width:1.5rem;height:1.5rem;color:#ef4444" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
      </div>
      <p style="font-size:.95rem;font-weight:600;color:#111827;margin-bottom:.5rem">Sign-in error</p>
      <p style="font-size:.8rem;color:#6b7280">{{ errorMessage }}</p>
      <p style="font-size:.75rem;color:#9ca3af;margin-top:.5rem">This window will close automatically.</p>
    </div>
  }
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
