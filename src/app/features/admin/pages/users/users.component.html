<div class="templates-page">

  <!-- ── Page Header ────────────────────────────────────────────────────── -->
  <div class="page-header-row">
    <app-page-header
      title="Users Management"
      description="Create and manage admin users.">
    </app-page-header>
    <button
      mat-flat-button
      color="primary"
      class="create-btn"
      (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Create User
    </button>
  </div>

  <!-- ── Filters Bar ────────────────────────────────────────────────────── -->
  <div class="filters-bar">
    <mat-form-field appearance="outline" class="filter-field search-field">
      <mat-label>Search users…</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchControl">
      <button *ngIf="searchControl.value" mat-icon-button matSuffix (click)="clearSearch()" matTooltip="Clear search">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field small-form-field">
      <mat-label>Role</mat-label>
      <mat-select
        [value]="roleFilter()"
        (selectionChange)="onRoleFilterChange($event.value)">
        <mat-option [value]="null">All Roles</mat-option>
        <mat-option *ngFor="let role of activeRoles()" [value]="role.name">
          {{ role.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field small-form-field">
      <mat-label>Status</mat-label>
      <mat-select
        [value]="statusFilter()"
        (selectionChange)="onStatusFilterChange($event.value)">
        <mat-option *ngFor="let opt of statusOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- ── Table Card ─────────────────────────────────────────────────────── -->
  <div class="table-card">

    <ng-container *ngIf="!isLoading() && users().length === 0">
      <app-empty-state
        icon="people"
        [title]="hasActiveFilters ? 'No users match your search' : 'No users found'"
        [description]="hasActiveFilters
          ? 'Try adjusting your search or filters.'
          : 'Create your first admin user.'">
      </app-empty-state>
    </ng-container>

    <div class="table-responsive" [class.hidden]="!isLoading() && users().length === 0">
      <table mat-table [dataSource]="users()" class="templates-table">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">
            <div class="template-name font-medium text-gray-900 dark:text-white">{{ row.name }}</div>
          </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let row" class="text-gray-600 dark:text-gray-400">
            {{ row.email }}
          </td>
        </ng-container>

        <!-- Provider Column -->
        <ng-container matColumnDef="authProvider">
          <th mat-header-cell *matHeaderCellDef>Provider</th>
          <td mat-cell *matCellDef="let row">
            <code class="template-badge bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-2 py-1 rounded text-xs">{{ row.authProvider }}</code>
          </td>
        </ng-container>

        <!-- Roles Column -->
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let row">
            <div class="flex flex-wrap gap-1">
              <span *ngFor="let role of row.roles" class="template-badge bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-2 py-1 rounded text-xs border border-blue-200 dark:border-blue-800">
                {{ role }}
              </span>
              <span *ngIf="row.roles?.length === 0" class="text-xs text-gray-400 italic">None</span>
            </div>
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <mat-spinner *ngIf="isToggling(row.id)" diameter="20" class="row-spinner" style="display: inline-block; margin-right: 8px; vertical-align: middle;"></mat-spinner>
            
            <mat-slide-toggle
              *ngIf="!isToggling(row.id)"
              [checked]="row.status === 'ACTIVE'"
              [matTooltip]="row.status === 'ACTIVE' ? 'Deactivate user' : 'Activate user'"
              (change)="toggleStatus(row)"
              class="status-toggle">
              <span class="status-label" [class.active-text]="row.status === 'ACTIVE'" [class.inactive-text]="row.status !== 'ACTIVE'">
                {{ row.status === 'ACTIVE' ? 'Active' : 'Inactive' }}
              </span>
            </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Created At Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created At</th>
          <td mat-cell *matCellDef="let row" class="date-cell">{{ formatDate(row.createdAt) }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
          <td mat-cell *matCellDef="let row" class="actions-cell p-0">
            <button
              mat-icon-button
              matTooltip="View User"
              (click)="openViewDialog(row)"
              class="action-btn view-btn">
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Edit User"
              (click)="openEditDialog(row)"
              class="action-btn view-btn">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Delete User"
              (click)="openDeleteDialog(row)"
              class="action-btn delete-btn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
      </table>
    </div>

    <!-- Paginator -->
    <mat-paginator
      *ngIf="!isLoading() && users().length > 0"
      [length]="totalElements()"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>

  </div>
</div>
