<div class="templates-page">

  <!-- ── Page Header ────────────────────────────────────────────────────── -->
  <div class="page-header-row">
    <app-page-header
      title="Roles Management"
      description="Create and manage user roles.">
    </app-page-header>
    <button
      mat-flat-button
      color="primary"
      class="create-btn"
      (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Create Role
    </button>
  </div>

  <!-- ── Filters Bar ────────────────────────────────────────────────────── -->
  <div class="filters-bar">
    <mat-form-field appearance="outline" class="filter-field search-field">
      <mat-label>Search roles…</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchControl">
      <button *ngIf="searchControl.value" mat-icon-button matSuffix (click)="clearSearch()" matTooltip="Clear search">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field small-form-field">
      <mat-label>Status</mat-label>
      <mat-select
        [value]="statusFilter()"
        (selectionChange)="onStatusFilterChange($event.value)">
        <mat-option *ngFor="let opt of statusOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- ── Table Card ─────────────────────────────────────────────────────── -->
  <div class="table-card">

    <ng-container *ngIf="!isLoading() && roles().length === 0">
      <app-empty-state
        icon="security"
        [title]="hasActiveFilters ? 'No roles match your search' : 'No roles found'"
        [description]="hasActiveFilters
          ? 'Try adjusting your search or status filter.'
          : 'Create your first role to start managing users.'">
      </app-empty-state>
    </ng-container>

    <div class="table-responsive" [class.hidden]="!isLoading() && roles().length === 0">
      <table mat-table [dataSource]="roles()" class="templates-table">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Role Name</th>
          <td mat-cell *matCellDef="let row">
            <div class="template-name font-medium text-gray-900 dark:text-white">{{ row.name }}</div>
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <mat-spinner *ngIf="isToggling(row.id)" diameter="20" class="row-spinner" style="display: inline-block; margin-right: 8px; vertical-align: middle;"></mat-spinner>
            
            <mat-slide-toggle
              *ngIf="!isToggling(row.id)"
              [checked]="row.status === 'ACTIVE'"
              [matTooltip]="row.status === 'ACTIVE' ? 'Deactivate role' : 'Activate role'"
              (change)="toggleStatus(row)"
              class="status-toggle">
              <span class="status-label" [class.active-text]="row.status === 'ACTIVE'" [class.inactive-text]="row.status !== 'ACTIVE'">
                {{ row.status === 'ACTIVE' ? 'Active' : 'Inactive' }}
              </span>
            </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Created Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created At</th>
          <td mat-cell *matCellDef="let row" class="date-cell">{{ formatDate(row.createdAt) }}</td>
        </ng-container>

        <!-- Last Updated Column -->
        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef>Last Updated</th>
          <td mat-cell *matCellDef="let row" class="date-cell">{{ formatDate(row.updatedAt) }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
          <td mat-cell *matCellDef="let row" class="actions-cell p-0">
            <button
              mat-icon-button
              matTooltip="View Role"
              (click)="openViewDialog(row)"
              class="action-btn view-btn">
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Edit Role"
              (click)="openEditDialog(row)"
              class="action-btn view-btn">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Delete Role"
              (click)="openDeleteDialog(row)"
              class="action-btn delete-btn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>
      </table>
    </div>

    <!-- Paginator -->
    <mat-paginator
      *ngIf="!isLoading() && roles().length > 0"
      [length]="totalElements()"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>

  </div>
</div>
