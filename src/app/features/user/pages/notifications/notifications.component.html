<div class="notifications-page">

  <!-- ── Page Header ─────────────────────────────────────────────────────── -->
  <app-page-header
    title="Notification History"
    description="View and inspect all notifications sent from your account.">
  </app-page-header>

  <!-- ── Filters ──────────────────────────────────────────────────────────── -->
  <div class="filters-bar">
     <mat-card-content class="p-6">
      <div class="flex flex-col lg:flex-row justify-between gap-4">
 <!-- Status filter -->
    <mat-form-field appearance="outline" class="filter-field small-form-field">
      <mat-label>Status</mat-label>
      <mat-select
        [value]="filters.status"
        (selectionChange)="onStatusFilterChange($event.value)">
        <mat-option *ngFor="let opt of statusOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Channel filter -->
    <mat-form-field appearance="outline" class="filter-field small-form-field">
      <mat-label>Channel</mat-label>
      <mat-select
        [value]="filters.channel"
        (selectionChange)="onChannelFilterChange($event.value)">
        <mat-option *ngFor="let opt of channelOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Clear filters -->
    <button
      *ngIf="hasActiveFilters"
      mat-stroked-button
      class="clear-filters-btn"
      (click)="clearFilters()">
      <mat-icon>filter_list_off</mat-icon>
      Clear Filters
    </button>
        </div>
     </mat-card-content>
    <!-- ── Table Card ───────────────────────────────────────────────────────── -->
</div>
<div class="table-card">

  <!-- Global loading overlay -->
  <div *ngIf="isLoading()" class="loading-overlay">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <!-- Empty state -->
  <ng-container *ngIf="!isLoading() && notifications().length === 0">
    <app-empty-state
      icon="notifications_none"
      title="No notifications found"
      [description]="hasActiveFilters
        ? 'No notifications match the selected filters. Try adjusting or clearing the filters.'
        : 'You have not sent any notifications yet.'">
    </app-empty-state>
  </ng-container>

  <!-- Mat Table -->
  <div class="table-responsive" [class.hidden]="!isLoading() && notifications().length === 0">
    <table mat-table [dataSource]="notifications()" class="notifications-table">

      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">
          <span class="id-cell" [matTooltip]="row.id">{{ shortId(row.id) }}…</span>
        </td>
      </ng-container>

      <!-- Channel Column -->
      <ng-container matColumnDef="channel">
        <th mat-header-cell *matHeaderCellDef>Channel</th>
        <td mat-cell *matCellDef="let row">
          <span class="channel-cell">
            <mat-icon class="channel-icon">{{ channelIcon(row.channel) }}</mat-icon>
            <span>{{ row.channel }}</span>
          </span>
        </td>
      </ng-container>

      <!-- Recipient Column -->
      <ng-container matColumnDef="recipient">
        <th mat-header-cell *matHeaderCellDef>Recipient</th>
        <td mat-cell *matCellDef="let row" class="recipient-cell">{{ row.recipient }}</td>
      </ng-container>

      <!-- Template Column -->
      <ng-container matColumnDef="template">
        <th mat-header-cell *matHeaderCellDef>Template</th>
        <td mat-cell *matCellDef="let row">
          <code class="template-badge">{{ row.template }}</code>
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">
          <app-status-chip
            [label]="statusLabel(row.status)"
            [variant]="statusVariant(row.status)">
          </app-status-chip>
        </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created At</th>
        <td mat-cell *matCellDef="let row" class="date-cell">{{ formatDate(row.createdAt) }}</td>
      </ng-container>

      <!-- Retry Count Column -->
      <ng-container matColumnDef="retryCount">
        <th mat-header-cell *matHeaderCellDef>Retries</th>
        <td mat-cell *matCellDef="let row" class="center-cell">
          <span [class.retry-warning]="row.retryCount > 0">{{ row.retryCount }}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button
            mat-icon-button
            matTooltip="View details"
            (click)="openDetail(row)"
            class="view-btn">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="table-row"></tr>
    </table>
  </div>

  <!-- Paginator -->
  <mat-paginator
    *ngIf="!isLoading() && notifications().length > 0"
    [length]="totalElements()"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>

</div>
