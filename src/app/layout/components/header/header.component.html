<div class="h-[64px] bg-app-surface text-app-on-surface border-b border-app-border px-lg flex items-center shadow-none">
  <button mat-icon-button (click)="toggleSidebar()" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>
  
  <span class="flex items-center gap-sm text-app-primary">
    <img class="w-9 h-9" src="small-logo.png" alt="">
    <span class="font-semibold text-[18px] text-app-on-surface">Notification Engine</span>
  </span>

  <span class="flex-1"></span>

  <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Toggle theme" class="mr-2">
    <mat-icon>{{ themeService.currentTheme() === 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </button>

  <ng-container *ngIf="authService.currentUser() as user">
    <div class="flex flex-col items-end mr-sm">
      <span class="text-[14px] font-medium leading-tight">{{ user.name }}</span>
      <!-- <span class="text-[12px] text-app-on-surface-variant uppercase font-technical">{{ user.roles[0] }}</span> -->
    </div>

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </ng-container>
</div>
