<mat-toolbar color="primary" class="app-header">
  <button mat-icon-button (click)="toggleSidebar()" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>
  
  <span class="brand-logo">
    <mat-icon>notifications_active</mat-icon>
    <span class="app-name">Notification Engine</span>
  </span>

  <span class="spacer"></span>

  <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Toggle theme" style="margin-right: 8px;">
    <mat-icon>{{ themeService.currentTheme() === 'light' ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </button>

  <ng-container *ngIf="authService.currentUser() as user">
    <div class="user-info">
      <span class="user-name">{{ user.name }}</span>
      <span class="user-role">| {{ user.roles[0] }}</span>
    </div>

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </ng-container>
</mat-toolbar>
