<section class="relative py-24 px-6 text-center overflow-hidden bg-[#0a0e1a] border-t border-[#6366f1]/15 transition-colors duration-200 dark:bg-[#07090f]" aria-labelledby="cta-heading">

  <div class="relative max-w-[680px] mx-auto flex flex-col items-center gap-5">
