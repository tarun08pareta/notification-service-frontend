<section
  class="relative py-24 px-6 text-center overflow-hidden transition-colors duration-200
         bg-[#f0f4ff] border-t border-[#e2e8f0]
         dark:bg-[#0a0e1a] dark:border-[#6366f1]/15"
  aria-labelledby="cta-heading">

  <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_80%_60%_at_50%_100%,rgba(99,102,241,0.07)_0%,transparent_70%),radial-gradient(ellipse_40%_30%_at_50%_0%,rgba(99,102,241,0.04)_0%,transparent_70%)] dark:bg-[radial-gradient(ellipse_80%_60%_at_50%_100%,rgba(99,102,241,0.14)_0%,transparent_70%),radial-gradient(ellipse_40%_30%_at_50%_0%,rgba(53,37,205,0.10)_0%,transparent_70%)]" aria-hidden="true"></div>

  <div class="relative max-w-[680px] mx-auto flex flex-col items-center gap-5">

    <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold font-technical tracking-wider uppercase border border-indigo-500/20 bg-indigo-500/10 text-indigo-700 dark:border-indigo-400/25 dark:bg-indigo-400/10 dark:text-indigo-300" aria-hidden="true">
      <span class="material-icons text-[14px]">bolt</span>
      Get started in minutes
    </div>

    <h2 id="cta-heading" class="m-0 font-primary text-[clamp(2rem,4vw,3rem)] font-bold leading-[1.15] tracking-tight text-slate-900 dark:text-slate-50">
      Build notifications once.<br />
      <span class="bg-clip-text text-transparent bg-gradient-to-br from-indigo-600 via-indigo-500 to-sky-500 dark:from-indigo-400 dark:via-indigo-300 dark:to-sky-300">Deliver them reliably.</span>
    </h2>

    <p class="m-0 max-w-[560px] leading-relaxed text-lg font-primary text-slate-600 dark:text-slate-400">
      Stop spreading provider-specific delivery logic across your application.
      Use one notification API and let the engine handle the complexity.
    </p>

    <div class="flex items-center justify-center gap-3 flex-wrap mt-2">
      <a routerLink="/signup"
        class="inline-flex items-center gap-2 px-7 py-3.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg text-[15px] font-semibold font-primary no-underline transition-all duration-150 hover:-translate-y-[2px] hover:shadow-[0_6px_24px_rgba(99,102,241,0.35)] focus-visible:outline-2 focus-visible:outline-indigo-400 focus-visible:outline-offset-[3px]"
        id="final-get-started" aria-label="Create your account and get started">
        Get Started
        <span class="material-icons text-[18px]">arrow_forward</span>
      </a>
      <button
        class="inline-flex items-center gap-2 px-6 py-3.5 rounded-lg text-[15px] font-semibold font-primary cursor-pointer transition-all duration-150 hover:-translate-y-[1px] focus-visible:outline-2 focus-visible:outline-indigo-400 focus-visible:outline-offset-[3px] bg-indigo-500/5 text-indigo-800 border border-indigo-500/20 hover:bg-indigo-500/10 hover:border-indigo-500/30 dark:bg-white/5 dark:text-slate-200 dark:border-white/10 dark:hover:bg-white/10 dark:hover:border-white/20"
        type="button" (click)="scrollToApi()" id="final-explore-api" aria-label="View API documentation section">
        <span class="material-icons text-[18px]">code</span>
        Explore API
      </button>
    </div>

  </div>
</section>
